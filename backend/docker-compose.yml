version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: perfscope-postgres
    environment:
      POSTGRES_DB: perfscope
      POSTGRES_USER: perfscope
      POSTGRES_PASSWORD: perfscope_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfscope -d perfscope"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - perfscope-network

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: perfscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - perfscope-network

  # PerfScope Backend API
  backend:
    build: .
    container_name: perfscope-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: perfscope
      DB_USER: perfscope
      DB_PASSWORD: perfscope_dev
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - perfscope-network
    restart: unless-stopped

  # pgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: perfscope-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@perfscope.io
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - perfscope-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  perfscope-network:
    driver: bridge