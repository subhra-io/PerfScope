services:
  - type: web
    name: perfscope-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: perfscope-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.vercel.app
    healthCheckPath: /health
    
databases:
  - name: perfscope-db
    databaseName: perfscope
    user: perfscope
    region: oregon
    plan: starter